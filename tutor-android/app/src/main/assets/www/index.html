<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Alumnos</title>
<style>
:root{
  --azul:#1F3A5F; --azul2:#2F5D9B; --acento:#3B82F6; --fondo:#EEF2F7; --tarjeta:#fff; --linea:#E2E8F0;
  --texto:#0F1B2D; --suave:#64748B; --tenue:#94A3B8;
  --verde:#15803D; --verde-f:#DCFCE7; --verde-p:#22C55E;
  --ambar:#B45309; --ambar-f:#FEF3C7; --ambar-p:#F59E0B;
  --morado:#6D28D9; --morado-f:#EDE9FE; --morado-p:#8B5CF6;
  --celeste:#0369A1; --celeste-f:#E0F2FE; --celeste-p:#0EA5E9;
  --gris:#475569; --gris-f:#F1F5F9; --gris-p:#94A3B8;
  --rojo:#B91C1C; --rojo-f:#FEE2E2;
  --sombra:0 1px 2px rgba(15,27,45,.05),0 4px 14px rgba(15,27,45,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--fondo);color:var(--texto);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* Cabecera */
.heroe{background:linear-gradient(180deg,#1F3A5F 0%,#28507F 100%);color:#fff;padding:10px 16px 46px;border-radius:0 0 26px 26px}
.barra-sup{display:flex;align-items:center;gap:6px;min-height:44px;margin:0 -8px}
.barra-sup .hueco{flex:1}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:inherit;flex:none;transition:background .15s}
.ico:active{background:rgba(255,255,255,.16)}
.heroe h1{font-size:27px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em;overflow-wrap:anywhere}
.heroe .sub{color:#B8C9E0;font-size:14.5px}
.persona{display:flex;align-items:center;gap:14px;margin-top:6px}
.persona h1{margin:0;font-size:23px}
main{padding:0 14px 110px;max-width:720px;margin:0 auto}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);background:var(--tarjeta);border-radius:18px;box-shadow:var(--sombra);margin-top:-32px;padding:14px 4px;position:relative}
.cifra{text-align:center;padding:0 4px;border-left:1px solid var(--linea)}
.cifra:first-child{border-left:0}
.cifra b{display:block;font-size:22px;font-weight:700;color:var(--azul);letter-spacing:-.02em}
.cifra span{display:block;font-size:11px;color:var(--suave);line-height:1.2;margin-top:2px}

/* Pestañas */
.pestanas{display:flex;background:#DDE5EF;border-radius:14px;padding:4px;margin:16px 0 12px}
.pestanas button{flex:1;padding:9px 6px;border-radius:11px;font-weight:600;font-size:14.5px;color:var(--suave);display:flex;gap:7px;align-items:center;justify-content:center;transition:all .15s}
.pestanas button.on{background:#fff;color:var(--azul);box-shadow:0 1px 3px rgba(15,27,45,.12)}
.globo{background:var(--azul2);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 7px;min-width:20px}
.pestanas button:not(.on) .globo{background:var(--tenue)}
.buscar{position:relative;margin-bottom:12px}
.buscar input{width:100%;padding:12px 14px 12px 42px;border:1px solid var(--linea);border-radius:14px;background:#fff;outline:0}
.buscar input:focus{border-color:var(--acento);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.buscar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--tenue)}

/* Tarjetas */
.tarjeta{background:var(--tarjeta);border-radius:18px;box-shadow:var(--sombra);margin-bottom:10px;overflow:hidden}
.alumno{display:flex;width:100%;text-align:left;padding:14px;gap:13px;align-items:center;transition:transform .12s}
.alumno:active{transform:scale(.985)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;flex:none;letter-spacing:.02em}
.avatar.g{width:58px;height:58px;font-size:20px;border:2px solid rgba(255,255,255,.35)}
.alumno .info{flex:1;min-width:0}
.alumno h2{margin:0;font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;overflow-wrap:anywhere}
.linea{font-size:13px;color:var(--suave);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:3px 9px 3px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.chip i,.pildora i{width:7px;height:7px;border-radius:50%;flex:none;background:currentColor}
.e-completada{background:var(--verde-f);color:var(--verde)}
.e-pendiente{background:var(--gris-f);color:var(--gris)}
.e-revisar{background:var(--ambar-f);color:var(--ambar)}
.e-sin_humanizar{background:var(--morado-f);color:var(--morado)}
.e-video_audio{background:var(--celeste-f);color:var(--celeste)}
.campana{background:var(--rojo-f);color:var(--rojo);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-flex;gap:4px;align-items:center}
.anillo{position:relative;flex:none}
.anillo span{position:absolute;inset:0;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--azul)}
.banner{display:flex;gap:10px;align-items:center;background:var(--rojo-f);color:var(--rojo);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14.5px;font-weight:600}
.banner.info{background:#E0ECFB;color:var(--azul)}
.banner button{margin-left:auto;font-weight:700;text-decoration:underline;white-space:nowrap}
.acciones{display:flex;gap:10px;margin:14px 0 4px}
.btn{background:var(--azul);color:#fff;border-radius:13px;padding:12px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.9}
.btn.sec{background:#fff;color:var(--azul);box-shadow:inset 0 0 0 1px var(--linea)}
.btn.rojo{background:var(--rojo-f);color:var(--rojo)}
.btn.ancho{width:100%;margin-top:8px}
.acciones .btn{flex:1}
h3.seccion{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin:22px 6px 9px;display:flex;align-items:center;gap:8px;font-weight:700}
h3.seccion .globo{background:#D5DEEA;color:var(--suave)}

/* Cursos */
.curso-cab{display:flex;width:100%;align-items:center;gap:12px;padding:13px 12px 13px 14px;text-align:left}
.curso-cab .titulo{flex:1;min-width:0}
.curso-cab b{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere}
.curso-cab small{color:var(--suave);font-size:13px}
.flecha{color:var(--tenue);transition:transform .2s}
.abierto .flecha{transform:rotate(180deg)}
.cuerpo{padding:0 14px 14px}
.cuerpo.recien{animation:baja .18s ease-out}
@keyframes baja{from{opacity:0;transform:translateY(-6px)}}
.segmento{display:flex;gap:6px;align-items:center;padding:2px 0 10px}
.segmento .tipos{display:flex;flex:1;background:var(--gris-f);border-radius:11px;padding:3px}
.segmento .tipos button{flex:1;padding:7px 2px;border-radius:9px;font-size:13px;font-weight:600;color:var(--suave)}
.segmento .tipos button.on{background:#fff;color:var(--azul);box-shadow:0 1px 2px rgba(15,27,45,.12)}
.cuadro{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--suave);background:var(--gris-f);flex:none}
.act{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--linea)}
.act .n{width:24px;height:24px;border-radius:50%;background:var(--gris-f);color:var(--suave);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.act.ok .n{background:var(--verde-p);color:#fff}
.act .medio{flex:1;min-width:0}
.act .nombre{display:block;width:100%;text-align:left;font-weight:500;overflow-wrap:anywhere}
.act.ok .nombre{color:var(--suave)}
.nota{font-size:13px;color:var(--suave);margin-top:2px;overflow-wrap:anywhere;white-space:pre-wrap}
.pildora{margin-top:7px;font-size:13px;font-weight:600;padding:6px 10px 6px 10px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;max-width:100%;text-align:left}
.pildora:active{filter:brightness(.95)}
.nueva{display:flex;gap:8px;margin-top:4px;padding-top:12px;border-top:1px solid var(--linea)}
.nueva input{flex:1;min-width:0;padding:11px 13px;border:1px solid var(--linea);border-radius:12px;background:var(--gris-f);outline:0}
.nueva input:focus{background:#fff;border-color:var(--acento)}
.nueva .btn{padding:0;width:46px;border-radius:12px}
.sugerir{display:flex;align-items:center;gap:8px;background:var(--verde-f);color:var(--verde);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:10px;width:100%;text-align:left}

/* Pendientes */
.filtros{display:flex;gap:7px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:600;background:#fff;color:var(--suave);box-shadow:inset 0 0 0 1px var(--linea);display:inline-flex;gap:6px;align-items:center}
.filtros button.on{background:var(--azul);color:#fff;box-shadow:none}
.pend{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;border-top:1px solid var(--linea)}
.pend:first-child{border-top:0}
.pend .medio{flex:1;min-width:0}
.pend .ir{display:block;width:100%;text-align:left}
.pend .ir b{display:block;font-weight:600;overflow-wrap:anywhere}
.pend .ir small{color:var(--suave);font-size:13px;overflow-wrap:anywhere}
.avatar.p{width:34px;height:34px;font-size:12.5px;margin-top:2px}

.fab{position:fixed;right:18px;bottom:22px;background:var(--azul);color:#fff;border-radius:18px;padding:15px 20px 15px 16px;font-weight:600;font-size:15.5px;box-shadow:0 8px 22px rgba(31,58,95,.4);z-index:6;display:flex;gap:8px;align-items:center;transition:transform .12s}
.fab:active{transform:scale(.95)}
.vacio{text-align:center;color:var(--suave);padding:44px 20px}
.vacio .dib{width:76px;height:76px;border-radius:24px;background:#DDE5EF;color:var(--azul2);display:grid;place-items:center;margin:0 auto 14px}
.vacio b{display:block;color:var(--texto);font-size:17px;margin-bottom:4px}

/* Ventanas */
.velo{position:fixed;inset:0;background:rgba(15,27,45,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:aparece .16s}
.modal{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:10px 18px 22px;max-height:92vh;overflow:auto;animation:sube .22s cubic-bezier(.2,.8,.2,1)}
.modal::before{content:"";display:block;width:38px;height:4px;border-radius:9px;background:#D5DEEA;margin:0 auto 14px}
@keyframes aparece{from{opacity:0}}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
.modal h2{margin:0 0 14px;font-size:19px;font-weight:700}
.modal p{margin:0 0 14px;color:var(--suave)}
.campo{display:block;margin-bottom:13px}
.campo span{display:block;font-size:13px;font-weight:600;color:var(--suave);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;padding:12px 13px;border:1px solid var(--linea);border-radius:12px;background:var(--gris-f);outline:0}
.campo input:focus,.campo select:focus,.campo textarea:focus{background:#fff;border-color:var(--acento);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.marca{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding:12px 13px;background:var(--gris-f);border-radius:12px;font-weight:500}
.marca input{width:20px;height:20px;accent-color:var(--azul);flex:none}
.pie{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.opcion{display:flex;width:100%;align-items:center;gap:12px;padding:14px 13px;border-radius:14px;font-weight:600;margin-bottom:7px;text-align:left}
.opcion i{width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.opcion svg{margin-left:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0F1B2D;color:#fff;padding:11px 18px;border-radius:13px;z-index:30;font-size:14.5px;max-width:90vw;animation:sube .2s;box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media(min-width:620px){.velo{align-items:center}.modal{border-radius:24px}.modal::before{display:none}}
@media(max-width:350px){.cifra b{font-size:19px}.cifra span{font-size:10px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="capa"></div>
<input type="file" id="archivo" accept=".json,application/json" hidden>
<script>
"use strict";
/* ============ Datos ============ */
var CLAVE = "mis-alumnos-v1";
var ESTADOS = [
  ["pendiente", "Falta por hacer"],
  ["revisar", "Hecha, falta algo por revisar"],
  ["sin_humanizar", "Completada, sin humanizar"],
  ["video_audio", "Pendiente entrega de video/audios"],
  ["completada", "Completada"]
];
var ESTADO_NOMBRE = {};
ESTADOS.forEach(function (e) { ESTADO_NOMBRE[e[0]] = e[1]; });
var TIPOS_CURSO = [["abierto", "Abierto"], ["por_hacer", "Por hacer"], ["completado", "Completado"]];
var TIPO_TITULO = { abierto: "Cursos abiertos", por_hacer: "Cursos por hacer", completado: "Cursos completados" };

var datos = cargar();
var desplegados = {};   // cursos abiertos en pantalla
var filtro = "";

function cargar() {
  try {
    var d = JSON.parse(localStorage.getItem(CLAVE));
    if (d && Array.isArray(d.alumnos)) return normalizar(d);
  } catch (e) {}
  return normalizar({ alumnos: [] });
}
function normalizar(d) {
  d.ajustes = d.ajustes || {};
  if (!(d.ajustes.umbral > 0)) d.ajustes.umbral = 10;
  if (d.ajustes.contar !== "hechas") d.ajustes.contar = "completadas";
  d.alumnos.forEach(function (a) {
    a.id = a.id || uid(); a.nombre = String(a.nombre || "Sin nombre"); a.avisado = a.avisado || 0;
    a.cursos = Array.isArray(a.cursos) ? a.cursos : [];
    a.cursos.forEach(function (c) {
      c.id = c.id || uid(); c.nombre = String(c.nombre || "Curso");
      if (!TIPO_TITULO[c.tipo]) c.tipo = "abierto";
      c.actividades = Array.isArray(c.actividades) ? c.actividades : [];
      c.actividades.forEach(function (t) {
        t.id = t.id || uid(); t.nombre = String(t.nombre || "Actividad");
        if (!ESTADO_NOMBRE[t.estado]) t.estado = "pendiente";
        t.nota = String(t.nota || "");
      });
    });
  });
  return d;
}
function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(datos)); }
  catch (e) { toast("No se pudo guardar: " + e.message); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function alumno(id) { return datos.alumnos.filter(function (a) { return a.id === id; })[0]; }
function curso(a, id) { return a.cursos.filter(function (c) { return c.id === id; })[0]; }

/* ============ Sumatorias ============ */
function cuenta(a) {
  var r = { abierto: 0, por_hacer: 0, completado: 0, total: 0, estados: {} };
  ESTADOS.forEach(function (e) { r.estados[e[0]] = 0; });
  a.cursos.forEach(function (c) {
    r[c.tipo]++;
    c.actividades.forEach(function (t) { r.estados[t.estado]++; r.total++; });
  });
  r.hechas = r.total - r.estados.pendiente;
  r.paraAviso = datos.ajustes.contar === "hechas" ? r.hechas : r.estados.completada;
  return r;
}
function cuentaCurso(c) {
  var ok = c.actividades.filter(function (t) { return t.estado === "completada"; }).length;
  return { ok: ok, total: c.actividades.length };
}
function textoAviso(n) {
  return n + " actividades " + (datos.ajustes.contar === "hechas" ? "hechas" : "completadas");
}
/* Avisa cada vez que un alumno alcanza un múltiplo del umbral (10, 20, 30...). */
function revisarAviso(a) {
  var n = cuenta(a).paraAviso, nivel = Math.floor(n / datos.ajustes.umbral);
  if (nivel > a.avisado) {
    a.avisado = nivel;
    guardar();
    aviso("🔔 " + a.nombre, "Ya llegaste a " + textoAviso(n) + " con este alumno.");
  } else if (nivel < a.avisado) { a.avisado = nivel; guardar(); }
}

/* ============ Pantallas ============ */
var pestana = "alumnos", filtroEstado = "todas", recienAbierto = null;
var ICONOS = {
  ajustes: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  volver: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
  lapiz: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  mas: '<path d="M12 5v14M5 12h14"/>',
  abajo: '<path d="M6 9l6 6 6-6"/>',
  lupa: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  doc: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',
  campana: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
  check: '<path d="M20 6L9 17l-5-5"/>',
  gente: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  libro: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  nube: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'
};
function ic(n, t) {
  t = t || 22;
  return '<svg width="' + t + '" height="' + t + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONOS[n] + "</svg>";
}
function h(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function avatar(nombre, clase) {
  var p = nombre.trim().split(/\s+/), ini = ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
  var n = 0; for (var i = 0; i < nombre.length; i++) n = (n * 31 + nombre.charCodeAt(i)) % 360;
  return '<span class="avatar ' + (clase || "") + '" style="background:hsl(' + n + ',48%,46%)">' + h(ini) + "</span>";
}
function anillo(ok, total, tam) {
  tam = tam || 46;
  var r = tam / 2 - 4, largo = 2 * Math.PI * r, pct = total ? ok / total : 0, c = tam / 2;
  return '<span class="anillo" style="width:' + tam + "px;height:" + tam + 'px"><svg width="' + tam + '" height="' + tam + '">' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="#E2E8F0" stroke-width="4"/>' +
    '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + (pct >= 1 ? "#22C55E" : "#2F5D9B") + '" stroke-width="4" stroke-linecap="round" stroke-dasharray="' +

      { n: "cuales", t: "Cursos a incluir", tipo: "lista", v: "todos", ops: [["todos", "Todos los cursos"], ["completado", "Solo completados"], ["abierto", "Solo abiertos"], ["por_hacer", "Solo por hacer"]] },

    ], function (v) {
      datos.ajustes.umbral = Math.max(1, parseInt(v.umbral, 10) || 10);
      datos.ajustes.contar = v.contar;
      datos.alumnos.forEach(function (a) { a.avisado = Math.floor(cuenta(a).paraAviso / datos.ajustes.umbral); });
      listo();
    });
    document.querySelector(".modal form").insertAdjacentHTML("afterend",
      '<h2 style="margin-top:22px">Respaldo</h2><p>Guarda una copia de todos tus datos o recupérala en otro teléfono.' +
      (datos.ajustes.respaldo ? " Último respaldo: " + new Date(datos.ajustes.respaldo).toLocaleDateString("es") + "." : "") + "</p>" +
      '<button class="btn sec ancho" data-a="exportar">Guardar respaldo</button><button class="btn sec ancho" data-a="importar">Restaurar respaldo</button>');
  },
  exportar: function () {
    var hoy = new Date().toISOString().slice(0, 10);
    datos.ajustes.respaldo = Date.now(); guardar();
    entregar("mis-alumnos-" + hoy + ".json", "application/json", new TextEncoder().encode(JSON.stringify(datos, null, 1)));
    window.cerrarModal(); pintar();
  },
  importar: function () { document.getElementById("archivo").click(); }
};

document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-a]");
  if (el && ACCION[el.dataset.a]) ACCION[el.dataset.a](el.dataset, ev);
});
document.addEventListener("change", function (ev) {
  var el = ev.target;
  if (el.id !== "archivo" || !el.files[0]) return;
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var d2 = JSON.parse(fr.result);
      if (!d2 || !Array.isArray(d2.alumnos)) throw 0;
      datos = normalizar(d2); listo(); toast("Respaldo restaurado: " + plural(datos.alumnos.length, "alumno", "alumnos"));
    } catch (e) { toast("Ese archivo no es un respaldo válido"); }
  };
  fr.readAsText(el.files[0]); el.value = "";
});
document.addEventListener("submit", function (ev) {
  ev.preventDefault();
  var f = ev.target, v = {};
  Array.prototype.forEach.call(f.elements, function (e) {
    if (e.name) v[e.name] = e.type === "checkbox" ? e.checked : e.value.trim();
  });
  if (f.dataset.f === "modal") { if (alCerrar && alCerrar.guardar) alCerrar.guardar(v); }
  else if (f.dataset.f === "nueva-act") {

    var a = alumno(f.dataset.al), cid = f.dataset.cu;
    curso(a, cid).actividades.push({ id: uid(), nombre: v.nombre, nota: "", estado: "pendiente" });

document.addEventListener("input", function (ev) {
  if (ev.target.id !== "buscar") return;

  var b = document.getElementById("buscar"); b.focus(); b.setSelectionRange(filtro.length, filtro.length);

window.addEventListener("hashchange", function () { window.cerrarModal(); pintar(); window.scrollTo(0, 0); });

/* ============ Archivos (Word y respaldo) ============ */
function entregar(nombre, mime, bytes) {
  if (window.AndroidBridge && AndroidBridge.saveFile) {
    var bin = "";
    for (var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    AndroidBridge.saveFile(nombre, mime, btoa(bin));
  } else {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: mime })); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
  }
}
function x(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
/* Párrafo de Word. o = {tam (pt), negrita, color, antes, despues, sangria, centro} */
function par(texto, o) {
  o = o || {};
  var pPr = '<w:spacing w:before="' + (o.antes || 0) + '" w:after="' + (o.despues == null ? 80 : o.despues) + '"/>' +
    (o.sangria ? '<w:ind w:left="' + o.sangria + '" w:hanging="' + (o.colgante || 0) + '"/>' : "") + (o.centro ? '<w:jc w:val="center"/>' : "") +
    (o.borde ? '<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="1F3A5F"/></w:pBdr>' : "") + (o.junto ? "<w:keepNext/>" : "");
  var rPr = '<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri"/>' + (o.negrita ? "<w:b/>" : "") +
    (o.color ? '<w:color w:val="' + o.color + '"/>' : "") + '<w:sz w:val="' + (o.tam || 11) * 2 + '"/>';
  var trozos = [].concat(texto).map(function (t) {
    var extra = typeof t === "object" ? t : null, txt = extra ? extra.t : t;
    return "<w:r><w:rPr>" + rPr + (extra && extra.suave ? '<w:i/><w:color w:val="64748B"/>' : "") + '</w:rPr><w:t xml:space="preserve">' + x(txt) + "</w:t></w:r>";
  }).join("");
  return "<w:p><w:pPr>" + pPr + "</w:pPr>" + trozos + "</w:p>";
}
function crearDocx(a, cursos, op) {
  var c = cuenta(a), b = "";
  b += par("Reporte de actividades", { tam: 22, negrita: true, color: "1F3A5F", despues: 40 });
  b += par("Alumno: " + a.nombre, { tam: 14, negrita: true, despues: 40 });
  b += par("Capella University · " + new Date().toLocaleDateString("es", { day: "numeric", month: "long", year: "numeric" }), { color: "64748B", despues: 200, borde: true });
  if (op.resumen) {
    var acts = 0, ok = 0;
    cursos.forEach(function (cu) { var k = cuentaCurso(cu); acts += k.total; ok += k.ok; });
    b += par("Resumen", { tam: 14, negrita: true, color: "1F3A5F", antes: 120 });
    b += par("Cursos completados: " + c.completado, { sangria: 360 });
    b += par("Cursos abiertos: " + c.abierto, { sangria: 360 });
    if (c.por_hacer) b += par("Cursos por hacer: " + c.por_hacer, { sangria: 360 });
    b += par("Actividades en este reporte: " + acts + (op.estados ? " (" + ok + " completadas)" : ""), { sangria: 360, despues: 160 });
  }
  var n = 0;
  TIPOS_CURSO.forEach(function (tp) {
    cursos.filter(function (cu) { return cu.tipo === tp[0]; }).forEach(function (cu) {
      n++;
      b += par(n + ". " + cu.nombre, { tam: 14, negrita: true, color: "1F3A5F", antes: 280, despues: 40, junto: true });
      b += par("Curso " + tp[1].toLowerCase() + " · " + cu.actividades.length + (cu.actividades.length === 1 ? " actividad" : " actividades"), { color: "64748B", tam: 10, despues: 100, junto: true });
      if (!cu.actividades.length) b += par("Sin actividades registradas.", { sangria: 360, color: "64748B" });
      cu.actividades.forEach(function (t, i) {
        var txt = [(i + 1) + ".  " + t.nombre];
        if (op.estados) txt.push({ t: "  —  " + ESTADO_NOMBRE[t.estado], suave: true });
        b += par(txt, { sangria: 720, colgante: 360 });
      });
    });
  });
  var doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + b +
    '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
  return zip([
    ["[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ["_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ["word/document.xml", doc]
  ]);
}
/* ZIP sin compresión: suficiente para un .docx y no necesita librerías. */
var TABLA_CRC = (function () {
  var t = new Uint32Array(256);
  for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(u) { var c = 0xFFFFFFFF; for (var i = 0; i < u.length; i++) c = TABLA_CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(archivos) {
  var enc = new TextEncoder(), partes = [], central = [], pos = 0;
  function cab(firma, largo) { var d = new DataView(new ArrayBuffer(largo)); d.setUint32(0, firma, true); return d; }
  archivos.forEach(function (f) {
    var nombre = enc.encode(f[0]), datosF = enc.encode(f[1]), crc = crc32(datosF);
    var l = cab(0x04034b50, 30);
    l.setUint16(4, 20, true); l.setUint16(6, 0x0800, true); l.setUint16(8, 0, true);
    l.setUint16(10, 0, true); l.setUint16(12, 0x21, true);
    l.setUint32(14, crc, true); l.setUint32(18, datosF.length, true); l.setUint32(22, datosF.length, true);
    l.setUint16(26, nombre.length, true);
    var c = cab(0x02014b50, 46);
    c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, datosF.length, true); c.setUint32(24, datosF.length, true);
    c.setUint16(28, nombre.length, true); c.setUint32(42, pos, true);
    partes.push(new Uint8Array(l.buffer), nombre, datosF);
    central.push(new Uint8Array(c.buffer), nombre);
    pos += 30 + nombre.length + datosF.length;
  });
  var tamCentral = central.reduce(function (s, p) { return s + p.length; }, 0);
  var fin = cab(0x06054b50, 22);
  fin.setUint16(8, archivos.length, true); fin.setUint16(10, archivos.length, true);
  fin.setUint32(12, tamCentral, true); fin.setUint32(16, pos, true);
  var todo = partes.concat(central, [new Uint8Array(fin.buffer)]);
  var out = new Uint8Array(todo.reduce(function (s, p) { return s + p.length; }, 0)), o = 0;
  todo.forEach(function (p) { out.set(p, o); o += p.length; });
  return out;
}
