name: Build Qué Me Pongo

on:
  workflow_dispatch:
  push:
    paths:
      - "quemepongo-android/**"
      - ".github/workflows/build-quemepongo.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    # Para guardar las capturas de pantalla en la rama.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: quemepongo-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Llave de subida a Google Play
        env:
          KEYSTORE_B64: ${{ secrets.QMP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/subida.jks"
            echo "QMP_KEYSTORE_PATH=$RUNNER_TEMP/subida.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secreto QMP_KEYSTORE_BASE64: la app sale firmada con la llave de pruebas. Sirve para instalarla en el teléfono, no para subirla a Google Play."
          fi

      - name: APK y AAB
        env:
          QMP_STORE_PASSWORD: ${{ secrets.QMP_STORE_PASSWORD }}
          QMP_KEY_PASSWORD: ${{ secrets.QMP_KEY_PASSWORD }}
          QMP_KEY_ALIAS: ${{ secrets.QMP_KEY_ALIAS }}
          QMP_ADMOB_APP_ID: ${{ secrets.QMP_ADMOB_APP_ID }}
          QMP_ADMOB_BANNER: ${{ secrets.QMP_ADMOB_BANNER }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Subir APK (para instalar en el teléfono)
        uses: actions/upload-artifact@v4
        with:
          name: quemepongo-apk
          path: quemepongo-android/app/build/outputs/apk/release/app-release.apk

      - name: Subir AAB (para Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: quemepongo-aab
          path: quemepongo-android/app/build/outputs/bundle/release/app-release.aab

      # Las pruebas van después de subir la APK: si fallan, igual se puede instalar y probar.
      - name: Pruebas
        run: gradle testDebugUnitTest

      - name: Subir capturas de pantalla (claro y oscuro)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: quemepongo-android/app/build/capturas/*.png
          if-no-files-found: ignore

      # Las capturas quedan en el repositorio: sirven para la ficha de Google Play
      # y para revisar el diseño. Un push hecho con GITHUB_TOKEN no vuelve a lanzar este workflow.
      - name: Guardar capturas en play-store/capturas
        if: success() && github.event_name == 'push'
        run: |
          ls app/build/capturas/*.png >/dev/null 2>&1 || exit 0
          mkdir -p play-store/capturas
          cp app/build/capturas/*.png play-store/capturas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play-store/capturas
          git diff --cached --quiet && exit 0
          git commit -m "Capturas de pantalla actualizadas"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::No se pudieron guardar las capturas (la rama cambió mientras tanto)"
