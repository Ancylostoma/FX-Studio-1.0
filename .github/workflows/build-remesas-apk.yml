name: Build Remesas APK

on:
  workflow_dispatch:
  push:
    paths:
      - "remesas-android/**"
      - ".github/workflows/build-remesas-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remesas-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Descargar la web de PeterServices
        run: ./sync-web.sh

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: remesas-apk
          path: remesas-android/app/build/outputs/apk/release/app-release.apk
